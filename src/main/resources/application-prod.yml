server:
  port: 1122

spring:
  config:
    import: "optional:file:./.env.prod[.properties]"
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true

  session:
    timeout: 30m
    data:
      redis:
        namespace: url-shortener
        repository-type: indexed

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP-SERVERS}

    security:
      protocol: SASL_SSL

    ssl:
      trust-store-type: PEM
      trust-store-location: ${KAFKA_CA_LOCATION}

    properties:
      "[sasl.mechanism]": SCRAM-SHA-256
      "[sasl.jaas.config]": >-
        org.apache.kafka.common.security.scram.ScramLoginModule required
        username="${KAFKA_USERNAME}"
        password="${KAFKA_PASSWORD}";

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

    consumer:
      group-id: click-analytics
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: com.appsdeveloperblog.ws.urlshorten.url.event


management:
  endpoints:
    web:
      exposure:
        include: health,metrics


app:
  base-url: http://localhost:1122
  frontend-base-url: http://localhost:5173
  auth:
    password-reset:
      token-ttl: 15m
      email-mode: log
  cache:
    redirect-ttl: 30m
  kafka:
    topics:
      short-url-clicked: "short-url-clicked"
  redis:
    click-channel: short-url:click-updated
    sign-up-email-rate-limit-hour: 1
    sign-up-email-rate-limit: 3
    sign-up-ip-rate-limit: 5
    sign-up-ip-rate-limit-minutes: 10

    sign-in-ip-rate-limit: 5
    sign-in-ip-rate-limit-minutes: 30

    password-reset-ip-rate-limit: 10
    password-reset-ip-rate-limit-minutes: 60
    password-reset-email-rate-limit: 3
    password-reset-email-rate-limit-hours: 1

  s3:
    endpoint: https://s3.${S3_REGION}.amazonaws.com
    region: ${S3_REGION}
    bucket-name: ${S3_BUCKET}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
    force-path-style: false
    initialize-bucket: false
    public-read: false

  scheduler:
    expire-urls-cron: "0 0 0 * * ?"
    lock-at-most-for: 10m

  jwt:
    secret-base64: Y29sdW1ucGlua3NvbGRpZXJnZW50bHlyZW1haW5jYWxtbGl2ZWhhcmJvcmFjY2lkZW4=
    acc_token_expiration: 900
    refresh_token_expiration: 86400
    issuer: link-flow
    audience: link-flow-api

logging:
  file:
    name: ./logs/url-shortener.log
  level:
    org.springframework.security: TRACE

