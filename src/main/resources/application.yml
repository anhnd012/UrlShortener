server:
  port: 11000

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/db_url_shortener
    username: admin
    password: 12345678x@X

  data:
    redis:
      host: localhost
      port: 6779

  session:
    timeout: 30m
    data:
      redis:
        namespace: url-shortener
        repository-type: indexed

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

    consumer:
      group-id: click-analytics
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: com.appsdeveloperblog.ws.urlshorten.url.event

management:
  endpoints:
    web:
      exposure:
        include: health,metrics


app:
  base-url: http://localhost:11000
  frontend-base-url: http://localhost:5173
  auth:
    password-reset:
      token-ttl: 15m
      email-mode: log
  cache:
    redirect-ttl: 30m
  kafka:
    topics:
      short-url-clicked: "short-url-clicked"
  redis:
    click-channel: short-url:click-updated
    sign-up-email-rate-limit-hour: 1
    sign-up-email-rate-limit: 3
    sign-up-ip-rate-limit: 5
    sign-up-ip-rate-limit-minutes: 10

    sign-in-ip-rate-limit: 5
    sign-in-ip-rate-limit-minutes: 30

    password-reset-ip-rate-limit: 10
    password-reset-ip-rate-limit-minutes: 60
    password-reset-email-rate-limit: 3
    password-reset-email-rate-limit-hours: 1

  s3:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: miniopassword123
    bucket-name: url-shortener-avatars
    region: us-east-1

  scheduler:
    expire-urls-cron: "0 0 0 * * ?"
    lock-at-most-for: 10m

logging:
  file:
    name: ./logs/url-shortener.log
