server:
  port: 11000

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/db_url_shortener
    username: admin
    password: 12345678x@X

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

    consumer:
      group-id: click-analytics
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: com.appsdeveloperblog.ws.urlshorten.url.event

management:
  endpoints:
    web:
      exposure:
        include: health,metrics


app:
  base-url: http://localhost:11000
  cache:
    redirect-ttl: 30m
  kafka:
    topics:
      short-url-clicked: "short-url-clicked"


logging:
  file:
    name: ./logs/url-shortener.log
