services:

  postgres:
    image: postgres:16

    container_name: postgres-db

    environment:
      POSTGRES_DB: db_url_shortener
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 12345678x@X

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d db_url_shortener"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7.4-alpine

    container_name: redis-cache

    ports:
      - "6779:6379"

    volumes:
      - redis-data:/data

    command: ["redis-server", "--appendonly", "yes"]

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 1s
      retries: 3

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka-broker

    ports:
      - "9092:9092"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
volumes:
  postgres-data:
  redis-data:

